<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마카오 오디오 가이드 · Hyunsu</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:16px 14px 60px; background:#0f1216; color:#e8eaed;
         font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  h1 { font-size:19px; margin:4px 0 2px; }
  .sub { font-size:13px; color:#9aa3ad; margin-bottom:18px; line-height:1.5; }
  h2 { font-size:15px; color:#7fd1ff; margin:26px 0 8px; border-bottom:1px solid #222a33; padding-bottom:6px; }
  .t { background:#161b21; border:1px solid #222a33; border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .n { font-size:14px; font-weight:600; }
  .d { font-size:12px; color:#8b95a1; margin:2px 0 8px; }
  audio { width:100%; height:34px; }
  a.dl { font-size:12px; color:#7fd1ff; text-decoration:none; display:inline-block; margin-top:7px; }
</style>
</head>
<body>

<div class="sub">Hyunsu 한국어 음성 · 31개 · 1시간 52분 · 현장에서 해당 장소 파일을 재생하세요.<br>

<div id="list"></div>
<script>

 ["Day1 · 11/28(토) 반도 → 코타이","","","",""],

 ["D1-03","몬테 요새","3:51","1622 네덜란드 격퇴·전망","Day1_03_몬테요새.mp3"],

 ["D2-02","아마 사원","4:01","‘마카오’ 이름의 기원","Day2_02_아마사원.mp3"],
 ["D2-03","릴라우 광장","2:22","릴라우의 물","Day2_03_릴라우광장.mp3"],
 ["D2-04","만다린 하우스","3:25","정관응·성세위언","Day2_04_만다린하우스.mp3"],
 ["D2-05","성 로렌스 성당","2:47","항해의 수호성인","Day2_05_성로렌스성당.mp3"],

 ["D2-07","마카오 대성당","3:14","총독 취임식의 성당","Day2_07_마카오대성당.mp3"],

 ["Day3 · 11/30(월) 아침 → 성 바울 → 타이파 → 귀국","","","",""],

 ["D3-02","나차 사원","2:43","성당 옆 도교 사원","Day3_02_나차사원.mp3"],
 ["D3-03","루 림 이옥 정원","3:24","쑤저우 기법·아침 태극권","Day3_03_루림이옥정원.mp3"],

 ["D3-07","타이파 빌리지","4:23","세이 키 주빠빠오","Day3_07_타이파빌리지.mp3"]
];
const el = document.getElementById('list');
for (const t of tracks) {
  if (!t[1]) { const h = document.createElement('h2'); h.textContent = t[0]; el.appendChild(h); continue; }
  const d = document.createElement('div'); d.className = 't';
  const src = 'audio/' + encodeURIComponent(t[4]);
  d.innerHTML = `<div class="n">${t[0]} · ${t[1]}</div><div class="d">${t[2]} · ${t[3]}</div>
    <audio controls preload="none" src="${src}"></audio>
    <a class="dl" href="${src}" download>⬇ MP3 내려받기</a>`;
  el.appendChild(d);
}
</script>
</body>
</html>
